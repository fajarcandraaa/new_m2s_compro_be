    get:
      operationId: adminExportLeads
      tags:
      - 'Admin: Leads'
      summary: Export leads as CSV
      x-roles:
      - admin
      description: |-
        Admin only (bulk personal data). Same filters as the list, unpaginated, ordered by createdAt desc. `Content-Type: text/csv; charset=utf-8`, UTF-8 with BOM (Excel), CRLF line endings, RFC 4180 quoting. Columns in order: `createdAt, name, company, email, whatsapp, service, startTimeframe, status, message, notes` (header row uses these names). `createdAt` is RFC3339 UTC; `service` = service title, falling back to the slug, empty if none. Cells starting with `= + - @ \t \r` are prefixed with `'` (CSV injection guard).

