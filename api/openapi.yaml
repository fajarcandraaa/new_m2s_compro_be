components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: m2s_session
      description: JWT set by POST /auth/login. HttpOnly, SameSite=Lax, Secure in production.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: CSRF guard. Value must equal `m2s-cms`; otherwise 403 `csrf_failed`. Required on mutating admin operations
        and on /auth/login, /auth/logout. Set once in the FE API client middleware.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Q:
      name: q
      in: query
      required: false
      description: Case-insensitive search (ILIKE) over the resource's text columns.
      schema:
        type: string
        maxLength: 100
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 120
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    ContentStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - draft
        - published
  responses:
    BadRequest:
      description: Malformed JSON, unknown field, or invalid query/path parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: Format permintaan tidak valid.
    Unauthorized:
      description: Missing, invalid or expired session cookie (or wrong credentials on login).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Sesi tidak valid. Silakan masuk kembali.
    Forbidden:
      description: Role not allowed, or missing/invalid `X-Requested-With` header (`csrf_failed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Anda tidak memiliki akses ke fitur ini.
    NotFound:
      description: Resource not found (or not publicly visible).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Data tidak ditemukan.
    Conflict:
      description: 'Uniqueness or business-rule conflict. `fields` names the responsible field when there is one: `slug` (slug_taken),
        `featured` (featured limit), `email` (email taken), `role` (self role change), `isActive` (self deactivation); self
        delete has no field.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            slugTaken:
              summary: Explicit slug already used
              value:
                error:
                  code: slug_taken
                  message: Slug sudah dipakai.
                  fields:
                    slug: Slug sudah dipakai.
            featuredLimit:
              summary: Third featured case study
              value:
                error:
                  code: conflict
                  message: Maksimal 2 studi kasus unggulan.
                  fields:
                    featured: Maksimal 2 studi kasus unggulan.
            emailTaken:
              summary: User email taken
              value:
                error:
                  code: conflict
                  message: Email sudah dipakai.
                  fields:
                    email: Email sudah dipakai.
    ValidationError:
      description: Field validation failed. `fields` keys are dot paths (see Error.fields).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Periksa kembali isian Anda.
              fields:
                title: Wajib diisi.
                seo.description: Maksimal 160 karakter.
                packages.0.priceValue: Wajib diisi.
                metrics.1.label: Wajib diisi.
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Terlalu banyak permintaan. Coba lagi sebentar lagi.
      headers:
        Retry-After:
          description: Seconds until the next request is allowed.
          schema:
            type: integer
            minimum: 1
    PayloadTooLarge:
      description: Upload exceeds UPLOAD_MAX_BYTES (2 MiB), or JSON body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: payload_too_large
              message: Ukuran file maksimal 2 MB.
    UnsupportedMediaType:
      description: File type not allowed (only JPEG, PNG, WebP; SVG rejected).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unsupported_media_type
              message: Format file harus JPG, PNG, atau WebP.
    NoContent:
      description: Deleted / done. No body.
  schemas:
    Error:
      type: object
      description: Error envelope used by every non-2xx JSON response.
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              maxLength: 64
              enum:
              - bad_request
              - validation_error
              - unauthorized
              - forbidden
              - csrf_failed
              - not_found
              - method_not_allowed
              - conflict
              - slug_taken
              - payload_too_large
              - unsupported_media_type
              - rate_limited
              - internal_error
              description: Stable machine-readable code. FE should branch on `code`, show `message`.
            message:
              type: string
              maxLength: 500
              description: Human-readable message in Bahasa Indonesia, safe to show in a toast.
            fields:
              type: object
              additionalProperties:
                type: string
                maxLength: 300
              description: 'Per-field messages (validation_error, slug_taken, conflict). Keys are **dot paths with numeric
                indices**, identical to react-hook-form paths: `title`, `seo.description`, `packages.0.priceValue`, `packages.1.features.2`,
                `deliverables.0.title`, `metrics.1.label`, `initialConditions.3`, `faqs.2.question`. An error about an array as a whole (count,
                duplicates, more than one highlighted package) uses the array key (`metrics`, `tags`, `packages`, `faqs`). Errors
                not tied to a field appear only in `message`.'
    PageMeta:
      type: object
      additionalProperties: false
      required:
      - page
      - pageSize
      - total
      properties:
        page:
          type: integer
          minimum: 1
          description: 1-based page number.
        pageSize:
          type: integer
          minimum: 1
          description: Items per page. Unpaginated and limit-based lists return page=1, pageSize = max(number returned, 1)
            and total = number returned. (The 100 cap applies only to the `pageSize` query parameter.)
        total:
          type: integer
          minimum: 0
          description: Total matching items across all pages.
    Seo:
      type: object
      description: SEO overrides. All fields nullable.
      additionalProperties: false
      required:
      - title
      - description
      - ogImageUrl
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 70
          description: '`<title>` override; null → FE falls back to the entity title.'
        description:
          type:
          - string
          - 'null'
          maxLength: 160
          description: Meta description; null → FE falls back to summary/excerpt.
        ogImageUrl:
          type:
          - string
          - 'null'
          format: uri-reference
          maxLength: 500
          pattern: ^(/uploads/[A-Za-z0-9._-]+|https?://.+)$
          description: Media URL (site-relative `/uploads/...` or absolute http(s)), or null. `""` is treated as null.
    ReorderInput:
      type: object
      additionalProperties: false
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 500
          description: Every id of the resource, in the desired order. sortOrder becomes 1..n. Missing/unknown ids → 422.
    Site:
      type: object
      description: Public company info + homepage toggles.
      additionalProperties: false
      required:
      - companyName
      - legalName
      - tagline
      - email
      - whatsappNumber
      - whatsappDisplay
      - whatsappGreeting
      - address
      - mapsUrl
      - linkedinUrl
      - instagramUrl
      - showTestimonials
      - showClientLogos
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 120
        legalName:
          type: string
          minLength: 1
          maxLength: 160
        tagline:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        whatsappNumber:
          type: string
          maxLength: 20
          pattern: ^\+[1-9][0-9]{7,14}$
          description: E.164, e.g. +6282230109923. FE strips `+` for wa.me links.
        whatsappDisplay:
          type: string
          maxLength: 32
          description: Formatted number for display.
        whatsappGreeting:
          type: string
          maxLength: 300
          description: Prefilled text for `https://wa.me/{number}?text={greeting}`.
        address:
          type: string
