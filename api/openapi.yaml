    ArticleInput:
      type: object
      description: 'Create / full update (full-object semantics). readMinutes is computed. Slug rules: POST without `slug`
        (absent or `""`) → BE uses slugify(title); if that slug is taken it appends `-2`, `-3`, … (never 409 for a generated
        slug); a title that slugifies to empty → 422 on `title`. PUT without `slug` keeps the current slug (never regenerated).
        An explicitly sent `slug` that is taken → 409 `slug_taken` with `fields.slug`. slugify: lowercase → Unicode NFKD and
        drop combining marks → `&` becomes ` dan ` → every run of characters outside `[a-z0-9]` becomes `-` → trim `-` at
        both ends → cut to 120 characters and trim a trailing `-`. Example: `AI & Teknologi` → `ai-dan-teknologi`.'
      additionalProperties: false
      required:
      - title
      - excerpt
      - contentHtml
      - status
      - publishedAt
      - tags
      - coverImageUrl
      - seo
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: 'URL slug: lowercase letters, digits and single hyphens.'
        excerpt:
          type: string
          maxLength: 400
        contentHtml:
          type: string
          maxLength: 200000
          description: HTML from Tiptap; sanitised on save.
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Publish time. Future value + status=published = scheduled. null with status=published → BE sets now.
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
          maxItems: 10
          description: 'Tag names in display order (first = primary tag). Tags are resolved by derived slug: an existing tag
            with the same slug is reused (its existing name wins), otherwise it is created. Duplicates within the payload
            are dropped (first occurrence kept).'
        coverImageUrl:
          type:
          - string
          - 'null'
          format: uri-reference
          maxLength: 500
          pattern: ^(/uploads/[A-Za-z0-9._-]+|https?://.+)$
          description: Media URL (site-relative `/uploads/...` or absolute http(s)), or null. `""` is treated as null.
        author:
          type: string
          maxLength: 120
          description: Defaults to `Tim Mind2Screen` when empty.
        faqs:
          type: array
          items:
            $ref: '#/components/schemas/FaqItem'
          maxItems: 10
          description: 'Optional (v1.1). Replaces all FAQ items; array order = display order. Omitted → `[]`. Question and
            answer are trimmed and stripped of HTML (bluemonday strict policy); a value that is empty after that or too long
            → 422 on `faqs.{i}.question` / `faqs.{i}.answer`; more than 10 items → 422 on `faqs`.'
        seo:
          $ref: '#/components/schemas/Seo'
