        '200':
          description: 'UTF-8 CSV with BOM and header row. `Content-Disposition: attachment; filename="leads-YYYYMMDD.csv"`.'
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              example: "\uFEFFcreatedAt,name,company,email,whatsapp,service,startTimeframe,status,message,notes\r\n2026-10-15T04:12:09Z,Budi\
