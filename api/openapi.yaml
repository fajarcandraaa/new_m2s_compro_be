    post:
      operationId: login
      tags:
      - Auth
      summary: Log in; sets the session cookie
      description: 'Requires `X-Requested-With: m2s-cms` (csrfHeader). Wrong/malformed email or password, or inactive user
        → 401 `unauthorized` (same message). Rate limit: 10/minute per client IP.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: admin@mindtoscreen.com
              password: rahasia-sekali
      security:
      - csrfHeader: []
      responses:
        '200':
          description: Logged in. Sets `m2s_session` (HttpOnly, SameSite=Lax, Secure in production, Path=/, Max-Age = JWT_TTL).
          headers:
            Set-Cookie:
              description: '`m2s_session=<jwt>; Path=/; HttpOnly; SameSite=Lax; Secure`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              example:
                data:
                  id: b0864cb2-dd7b-5bd3-a703-c8a809918d63
                  name: Admin Mind2Screen
                  email: admin@mindtoscreen.com
                  role: admin
                  isActive: true
                  lastLoginAt: '2026-10-15T03:00:00Z'
                  createdAt: '2026-10-15T02:00:00Z'
                  updatedAt: '2026-10-15T03:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Log out; clears the session cookie
      description: 'Requires `X-Requested-With: m2s-cms` (csrfHeader); the session cookie is optional.'
      security:
      - csrfHeader: []
      responses:
        '204':
          description: 'Logged out (cookie cleared with Max-Age=0). Idempotent: also 204 without a valid session.'
          headers:
            Set-Cookie:
              description: '`m2s_session=; Path=/; Max-Age=0`'
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
