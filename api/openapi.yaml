            example:
              ids:
              - 475649ac-d80c-571b-a35b-4881b3d5e042
              - 527a69e1-2b83-5738-8e81-fc23d2986525
              - fe2ed0d9-295b-5767-bde4-d65cfd948bbe
              - e51588fa-b836-5b39-a449-4e90eb6659ec
