        multipart/form-data with one `file` part. Max 2 MiB. Type detected by content sniffing: JPEG, PNG, WebP only (SVG and everything else → 415). Stored under UPLOAD_DIR with a random name and served at `/uploads/<name>`. Not revalidating (the entity that references it triggers revalidation).

        Roles: admin, editor.
      security:
      - sessionCookie: []
        csrfHeader: []
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MediaUpload'
              example:
                data:
                  url: /uploads/9c41e2a7b3d84f15a0c6e1d2f3b4a596.webp
                  filename: 9c41e2a7b3d84f15a0c6e1d2f3b4a596.webp
                  mimeType: image/webp
                  size: 184322
                  width: 1600
                  height: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  contentMediaType: application/octet-stream
                  description: Image file (jpg, png, webp), max 2 MiB.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
