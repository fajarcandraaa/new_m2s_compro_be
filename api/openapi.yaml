                    body: Memetakan data yang tersedia dibandingkan dengan data yang dibutuhkan untuk keputusan.
                  - title: ETL pipeline
                    body: Konsolidasi data dari berbagai sumber ke satu tempat yang bisa dipercaya.
                  - title: Dashboard pelaporan & business intelligence
                    body: KPI yang diperbarui otomatis untuk manajemen dan tiap divisi.
                  - title: Custom reporting
                    body: Laporan yang disesuaikan dengan kebutuhan eksekutif dan operasional.
                  systems:
