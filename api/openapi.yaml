# Mind2Screen API contract — single source of truth for BE and FE.
# OpenAPI 3.1. Examples are derived from docs/content/seed.json and articles.json.
openapi: 3.1.0
info:
  title: Mind2Screen Company Profile API
  version: 1.1.0
  description: |
    REST API for the Mind2Screen company profile (public site + CMS).

    ## Changelog
    - **1.1.0** (additive, non-breaking): FAQ items for SEO/GEO (FAQPage JSON-LD). New schema `FaqItem`; `faqs` (max 10) is always present on `Service`, `ServiceAdmin`, `Article` and `ArticleAdmin` (`[]` when none) and optional on `ServiceInput` / `ArticleInput` (omitted → `[]`). List/summary schemas are unchanged.
    - **1.0.0**: initial frozen contract (`contract-v1.0`).

    ## Conventions
    - Base path `/api/v1` (browser reaches it same-origin through the Next.js rewrite of `/api/*`; Server Components call `BACKEND_URL` directly). `GET /healthz` lives at the root.
    - JSON, camelCase. Times are returned as RFC3339 in UTC (`2026-10-15T03:30:00Z`); inputs accept RFC3339 with any offset. Business dates are interpreted in Asia/Jakarta (WIB) and the FE formats all dates in WIB.
    - Single item: `{ "data": {...} }`. List: `{ "data": [...], "meta": { "page", "pageSize", "total" } }`. Unpaginated lists still carry `meta`.
    - Errors: `{ "error": { "code", "message", "fields"? } }` — see `components/schemas/Error` for codes. `fields` keys are dot paths with numeric indices (`packages.0.priceValue`, `seo.title`, `metrics.1.label`, `initialConditions.2`, `faqs.2.question`). Unknown routes → JSON 404 `not_found`; wrong method → JSON 405 `method_not_allowed`.
    - Write semantics:
      - **POST / PUT = full object.** A missing property is treated as its zero value (`null` / `false` / `""` / `[]`). Clients always send the complete object (the generated types enforce it); required-ness is enforced by FE types, not by a BE 422 for missing keys.
      - **PATCH = partial** (`LeadPatchInput`, `SettingsTogglesInput`). An absent key means unchanged; `null` clears a nullable field; `{}` → 422 `validation_error`.
      - For fields typed `string | null`, the BE trims and treats `""` as `null` before validation. All strings are trimmed.
      - Unknown body properties → 400 `bad_request`. JSON bodies over 1 MiB → 413.
    - Parameters: a path slug that does not match the slug pattern → 404 `not_found` (the FE renders a real 404). An admin `{id}` that is not a UUID → 400. Query values outside the schema (`pageSize > 100`, `page < 1`, booleans other than `true`/`false`, unknown enum values) → 400 `bad_request`. A page past the end → 200 with `data: []` and the real `total`. Unknown query parameters are ignored.
    - Ordering: admin content lists are ordered by `updatedAt desc`, except reorderable resources (services, testimonials, client logos: `sortOrder`, unpaginated). Leads: `createdAt desc`.
    - Slugs: see `ServiceInput` / `ArticleInput` / `CaseStudyInput` descriptions for generation, collision and slugify rules (`AI & Teknologi` → `ai-dan-teknologi`).
    - Phone numbers (`Lead.whatsapp`, `Site.whatsappNumber`) are normalised to E.164 (`08…` / `628…` → `+628…`); anything that cannot be normalised → 422.
    - Public detail endpoints address content by `slug`; admin endpoints by UUID `id`.
    - Public endpoints only expose visible content (status `published`; articles also need `publishedAt <= now`). Draft/scheduled → 404.

    ## Auth
    - `POST /auth/login` sets the httpOnly cookie `m2s_session` (JWT HS256, SameSite=Lax, Secure in production).
    - Every `/admin/*` endpoint and `/auth/me` require the cookie. Roles per operation are listed in its description and in `x-roles`.
      - `admin`: everything.
      - `editor`: content (articles, services, case studies, promos, testimonials, client logos, media, homepage toggles), dashboard, read-only leads.
    - CSRF: every mutating request under `/admin/*`, plus `POST /auth/login` and `POST /auth/logout`, must send `X-Requested-With: m2s-cms` (security scheme `csrfHeader`). The check runs before the session check, so a missing header → 403 `csrf_failed` even when unauthenticated.
    - Lead export (`GET /admin/leads/export`) and lead updates are admin-only; editors may read leads.

    ## Revalidation (BE → FE)
    After a successful admin mutation the BE fires (async, 3 s timeout, failures only logged):

    ```
    POST {FRONTEND_URL}/api/revalidate
    X-Revalidate-Secret: {REVALIDATE_SECRET}
    Content-Type: application/json

    { "tags": ["articles"] }
    ```

    Cache tags (the FE tags its `fetch` calls with the same names, `revalidate: 300` as a fallback):

    | Tag | Endpoints it covers | Fired by |
    |---|---|---|
    | `site` | `GET /site` | PUT /admin/settings, PATCH /admin/settings/toggles |
    | `services` | `GET /services`, `GET /services/{slug}` | service create/update/delete/reorder |
    | `case-studies` | `GET /case-studies`, `GET /case-studies/{slug}` | case-study create/update/delete |
    | `articles` | `GET /articles`, `/articles/{slug}`, `/articles/{slug}/related`, `GET /tags` | article create/update/delete |
    | `promos` | `GET /promos` | promo create/update/delete; service changes (promo embeds service title) |
    | `testimonials` | `GET /testimonials` | testimonial create/update/delete/reorder |
    | `client-logos` | `GET /client-logos` | client-logo create/update/delete/reorder |

    Scheduled articles become visible without a CMS action, so the FE's 300 s `revalidate` window is the publish latency for scheduled posts.
  contact:
    name: Mind2Screen
    email: hello@mindtoscreen.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /api/v1
  description: Relative to the BE origin (or the FE origin via rewrite).
security: []
tags:
- name: System
  description: Health check.
- name: Public
  description: Unauthenticated read endpoints + lead submission. Cached by the FE with the tags listed in info.description.
- name: Auth
  description: Cookie session.
- name: 'Admin: Dashboard'
  description: Counts and recent items for the CMS home.
- name: 'Admin: Settings'
  description: Company info (admin) and homepage toggles (admin + editor).
- name: 'Admin: Services'
  description: Service CRUD, packages (replaced as a whole) and ordering.
- name: 'Admin: Case Studies'
  description: Case-study CRUD. At most 2 published case studies can be featured.
- name: 'Admin: Articles'
  description: Article CRUD with tags, scheduling and SEO.
- name: 'Admin: Promos'
  description: Promo CRUD; status is computed.
- name: 'Admin: Testimonials'
  description: Testimonial CRUD and ordering.
- name: 'Admin: Client Logos'
  description: Client-logo CRUD and ordering (image from /admin/media).
- name: 'Admin: Leads'
  description: Read leads (admin + editor); update status/notes and CSV export (admin only).
- name: 'Admin: Media'
  description: Image upload.
- name: 'Admin: Users'
  description: Admin only.
paths:
  /healthz:
    servers:
    - url: /
      description: Root of the BE origin (outside /api/v1).
    get:
      operationId: getHealth
      tags:
      - System
      summary: Liveness + DB check
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: ok
        '503':
          description: Database unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                db: down
  /site:
    get:
      operationId: getSite
      tags:
      - Public
      summary: Company info and homepage toggles
      description: 'Cache tag: `site`.'
      security: []
      responses:
        '200':
          description: Site settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Site'
              example:
                data:
                  companyName: Mind2Screen
                  legalName: Mindtoscreen Technology Indonesia
                  tagline: From Idea to Digital Reality
                  email: hello@mindtoscreen.com
                  whatsappNumber: '+6282230109923'
                  whatsappDisplay: +62 822-3010-9923
                  whatsappGreeting: Halo Mind2Screen, saya ingin berdiskusi tentang kebutuhan sistem.
                  address: Jln. Terusan Segawe 5, Bandungrejosari, Sukun, Malang, Jawa Timur
                  mapsUrl: null
                  linkedinUrl: null
                  instagramUrl: null
                  showTestimonials: true
                  showClientLogos: false
  /services:
    get:
      operationId: listServices
      tags:
      - Public
      summary: List published services (by sortOrder)
      description: 'Unpaginated, ordered by sortOrder. Cache tag: `services`.'
      parameters:
      - name: audience
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ServiceAudience'
      security: []
      responses:
        '200':
          description: Services.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
              example:
                data:
                - slug: custom-software-development
                  audience: business
                  sortOrder: 1
                  eyebrow: Utama
                  title: Custom Software Development
                  tagline: Sistem internal yang tumbuh bersama bisnis Anda, bukan sistem yang menghambatnya.
                  summary: Sistem internal yang disesuaikan dengan proses bisnis unik perusahaan Anda, bukan solusi generik.
                  points:
                  - Discovery & pemetaan proses bisnis
                  - HRIS, DMS, ERP internal, approval workflow
                  - Integrasi dengan sistem yang sudah ada
                  - Dokumentasi teknis & knowledge transfer
                  priceLabel: Model kerja
                  priceValue: BOS atau BOR
                  audienceText: Perusahaan dengan proses bisnis yang kompleks, tim yang lelah dengan spreadsheet dan approval
                    lewat chat, atau yang pernah gagal mengimplementasikan sistem internal.
                  deliverables:
                  - title: Requirement discovery & business process mapping
                    body: Workshop dengan stakeholder untuk memetakan alur kerja dan memutuskan fitur mana yang paling penting.
                  - title: HRIS, DMS, ERP internal, dan approval workflow
                    body: Modul dirancang terpisah tapi bisa saling terhubung, sehingga bisa ditambah bertahap.
                  - title: Integrasi dengan sistem yang sudah ada
                    body: Third-party API, database lama, atau tools yang sudah dipakai tim Anda.
                  - title: Dokumentasi teknis dan knowledge transfer
                    body: Supaya tim internal Anda bisa merawat dan mengembangkan sistem tanpa bergantung pada satu orang.
                  systems:
                  - HRIS
                  - DMS
                  - Approval Workflow
                  - Internal Portal
                  - ERP Internal
                  - Dashboard KPI
                  packages: []
                  faqs:
                  - question: Apa saja yang termasuk dalam layanan Custom Software Development?
                    answer: Mulai dari discovery dan pemetaan proses bisnis bersama stakeholder, perancangan sistem, pengembangan per modul, integrasi dengan sistem yang sudah ada, sampai dokumentasi teknis dan knowledge transfer ke tim internal Anda. Sistem yang biasa Kami bangun antara lain HRIS, DMS, ERP internal, approval workflow, portal internal, dan dashboard KPI, semuanya disesuaikan dengan proses bisnis perusahaan Anda, bukan solusi generik.
                  - question: Bagaimana cara menentukan biaya pengembangan sistem?
                    answer: Kami memakai dua model kerja. BOS (Based on Scope) memakai harga tetap per proyek dengan ruang lingkup yang dikunci di awal kontrak, cocok jika kebutuhan sudah terdokumentasi. BOR (Based on Request) dibayar sesuai waktu kerja yang dipakai dan ruang lingkupnya bisa berubah tiap sprint, cocok untuk MVP atau pengembangan berkelanjutan. Model yang paling cocok Kami rekomendasikan setelah sesi discovery.
                  - question: Berapa lama waktu yang dibutuhkan untuk membangun sistem internal?
                    answer: Tergantung ruang lingkup dan jumlah modul, sehingga durasi baru bisa diperkirakan dengan jujur setelah discovery, ketika alur kerja dan prioritas fitur sudah jelas. Karena sistem dibangun per modul, modul yang paling mendesak bisa dipakai lebih dulu sementara modul berikutnya dikembangkan bertahap.
                  - question: Apakah ada pendampingan setelah sistem mulai dipakai?
                    answer: Ada. Setelah go-live Kami mendampingi masa stabilisasi, melatih tim internal, dan bisa melanjutkan pengembangan modul berikutnya. Bentuk dan durasi dukungan disepakati di awal sesuai model kerja yang dipilih, supaya tim Anda tahu persis apa yang ditangani dan ke mana harus melapor jika ada kendala.
                  - question: Siapa yang memiliki data dan source code sistem?
                    answer: Data operasional tetap milik perusahaan Anda. Kepemilikan source code dan akses ke server disepakati secara tertulis di kontrak sebelum pengembangan dimulai. Dokumentasi teknis dan knowledge transfer disiapkan supaya tim internal Anda bisa merawat dan mengembangkan sistem tanpa bergantung pada satu orang.
                  seo:
