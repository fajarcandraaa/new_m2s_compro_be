      tags:
      - Public
      summary: Submit a discussion brief (form /diskusi)
      description: '**Must be called from the browser via the same-origin `/api` rewrite** — never proxied through a Server
        Action or Route Handler, because rate limiting keys on the client IP. Rate limit: 5 requests/minute per client IP
        (429 + Retry-After). Honeypot: if `website` is non-empty the BE responds 201 with a random id and stores nothing (checked
        before validation). `whatsapp` is normalised to E.164. No CSRF header required (public form).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreateInput'
            example:
              name: Budi Santoso
              company: PT Contoh Sejahtera
              email: budi@contoh.co.id
              whatsapp: 0812-3456-7890
              service: custom-software-development
              startTimeframe: 1–3 bulan lagi
              message: Kami ingin memindahkan pengajuan cuti dan lembur dari spreadsheet ke sistem internal.
              website: ''
      security: []
      responses:
        '201':
          description: Lead received.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/LeadCreated'
              example:
                data:
                  id: 02767e75-5466-5d05-84e5-eb7af7462965
                  createdAt: '2026-10-15T04:12:09Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
