# Dokploy "Compose" application for the backend only.
# PostgreSQL is managed externally by infra on the overlay network
# `app-database-network`; this file defines NO postgres service and exposes
# NO database port to the public internet.
#
# Every ${VAR} is set in Dokploy's Environment UI; nothing secret lives here.
services:
  be:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Database connection string is provided by Dokploy env; no credentials
      # are hardcoded or baked into the image.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL, e.g. postgres://user:pass@mindtoscreen-apppostgresql-bewo3d:5432/mindtoscreen_db?sslmode=disable}
      MIGRATE_ON_START: "true"
      SEED_ON_START: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-12h}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-2097152}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL, e.g. http://<fe-service-name>:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    networks:
      app-database-network: {}   # external overlay; reaches infra PostgreSQL by service hostname
      dokploy-network:
        aliases:
          - m2s-be               # FE: BACKEND_URL=http://m2s-be:8080
    # Resource limits per infra team decision (Swarm service labels).
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

volumes:
  uploads:

networks:
  app-database-network:
    external: true
  dokploy-network:
    external: true
